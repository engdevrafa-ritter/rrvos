<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rrv.o.s — Ordens de Serviço</title>
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#1b1f2a; --mut:#6b7280; --line:#e3e6ec;
  --side:#14171f; --side2:#1d212c; --brand:#e8590c; --brand2:#c84b08;
  --ok:#168a4a; --warn:#b7791f; --bad:#c0392b; --info:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* login */
#login{min-height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#14171f 0%,#262c3b 100%);padding:20px}
.login-box{background:#fff;border-radius:14px;padding:34px 30px;width:100%;max-width:370px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo{font-size:30px;font-weight:800;letter-spacing:-1px}
.logo b{color:var(--brand)}
.login-box p{color:var(--mut);margin:4px 0 22px}

/* layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--side);color:#cfd4e0;padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .logo{color:#fff;padding:4px 10px 18px;font-size:24px}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
nav button:hover{background:var(--side2)}
nav button.on{background:var(--brand);color:#fff}
.me{border-top:1px solid #2a2f3d;padding-top:12px;font-size:12px;color:#9aa3b5}
.me b{display:block;color:#fff;font-size:13px}
.me button{margin-top:8px;margin-right:6px}
main{padding:24px 28px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin-bottom:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}

/* componentes */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi .n{font-size:26px;font-weight:800;margin-top:4px}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#fafbfc;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfd}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.empty{padding:30px;text-align:center;color:var(--mut)}

.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:#f4f5f8}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn.wa{background:#25d366;border-color:#25d366;color:#053b1d}
.btn.wa:hover{background:#1ebe5a}
.btn.red{color:var(--bad);border-color:#efc4be}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:#3a4050;color:#cfd4e0}
.btn.ghost:hover{background:var(--side2)}
a.btn{text-decoration:none;display:inline-block}

label{display:block;font-size:12px;font-weight:600;color:#444b5a;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid #cfd4de;border-radius:8px;padding:9px 11px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #f7c3a6;border-color:var(--brand)}
textarea{min-height:70px;resize:vertical}
.row{display:grid;gap:12px;margin-bottom:12px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:2fr 1fr 1fr 1fr}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
.chk input{width:auto}
.search{max-width:320px}

.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.s-Aberta{background:#e0ecff;color:#1d4ed8}
.s-Emandamento{background:#fff1d6;color:#9a5b00}
.s-Aguardandopeça,.s-Aguardandoaprovação{background:#fde4ec;color:#a31c4b}
.s-Concluída{background:#d9f5e5;color:#0f7a3f}
.s-Entregue{background:#e5e7eb;color:#374151}
.s-Cancelada{background:#fbdcd8;color:#a52a1d}
.low{color:var(--bad);font-weight:700}
.mut{color:var(--mut)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,18,28,.55);display:flex;justify-content:center;align-items:flex-start;padding:30px 14px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.sm{max-width:460px}
.modal h2{margin:0 0 16px;font-size:18px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.err{background:#fdecea;color:var(--bad);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.total{font-size:20px;font-weight:800;text-align:right;margin-top:10px}
.items input{padding:6px 8px}
.items td{padding:6px 6px}
.toast{position:fixed;bottom:20px;right:20px;background:#1b1f2a;color:#fff;padding:11px 16px;border-radius:10px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}

@media(max-width:820px){
  #app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:column}
  nav{flex-direction:row;flex-wrap:wrap}
  main{padding:16px}
  .c2,.c3,.c4{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <div class="logo">rrv<b>.o.s</b></div>
    <p>Sistema de Ordens de Serviço</p>
    <div id="loginErr" class="err hidden"></div>
    <div class="row"><div><label>Usuário</label><input id="lUser" autocomplete="username" autofocus></div></div>
    <div class="row"><div><label>Senha</label><input id="lPass" type="password" autocomplete="current-password"></div></div>
    <button class="btn pri" style="width:100%;padding:11px">Entrar</button>
  </form>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="logo">rrv<b>.o.s</b></div>
    <nav id="nav"></nav>
    <div class="me">
      <b id="meNome"></b><span id="meTipo"></span><br>
      <button class="btn ghost sm" id="btnSenha">Alterar senha</button>
      <button class="btn ghost sm" id="btnSair">Sair</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
"use strict";
const S = {me:null, clientes:[], produtos:[], os:[], config:{}, view:"painel", busca:{os:"",cli:"",prod:"",status:""}};
const STATUS = ["Aberta","Em andamento","Aguardando peça","Aguardando aprovação","Concluída","Entregue","Cancelada"];
const $ = (s,el=document)=>el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; };
const fdate = d => d ? d.split("-").reverse().join("/") : "";
const tagCls = s => "s-"+String(s).replace(/\s/g,"");
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

async function api(method, url, body){
  const r = await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"});
  let data=null; try{ data = await r.json(); }catch(e){}
  if(r.status===401 && url!=="/api/login"){ showLogin(); throw new Error("Sessão expirada. Entre novamente."); }
  if(!r.ok) throw new Error((data&&data.erro)||"Erro inesperado");
  return data;
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ---------- WhatsApp ---------- */
function waNumber(tel){
  let d = String(tel||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("0")) d = d.replace(/^0+/,"");
  if(d.length<=11) d = "55"+d;
  return d;
}
function waLink(tel,msg){ const n=waNumber(tel); return n ? "https://wa.me/"+n+"?text="+encodeURIComponent(msg||"") : ""; }
function waOpen(tel,msg){
  const l = waLink(tel,msg);
  if(!l){ toast("Cliente sem telefone cadastrado"); return; }
  window.open(l,"_blank","noopener");
}
function msgOS(o){
  const c = clienteById(o.clienteId)||{};
  const base = S.config.msgOS || "Olá {cliente}! Sua O.S nº {numero} está: {status}.";
  return base.replaceAll("{cliente}",(c.nome||"").split(" ")[0]).replaceAll("{oficina}",S.config.oficina||"")
    .replaceAll("{numero}",o.numero).replaceAll("{veiculo}",[o.veiculo,o.placa].filter(Boolean).join(" "))
    .replaceAll("{status}",o.status).replaceAll("{total}",money(o.total));
}
const clienteById = id => S.clientes.find(c=>c.id===id);
const produtoById = id => S.produtos.find(p=>p.id===id);

/* ---------- Login / sessão ---------- */
function showLogin(){ $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#lPass").value=""; setTimeout(()=>$("#lUser").focus(),50); }
async function showApp(){
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#meNome").textContent = S.me.nome; $("#meTipo").textContent = S.me.admin?"Administrador":"Usuário";
  await loadAll(); go(S.view);
}
async function loadAll(){
  [S.clientes,S.produtos,S.os,S.config] = await Promise.all([api("GET","/api/clientes"),api("GET","/api/produtos"),api("GET","/api/os"),api("GET","/api/config")]);
}
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault(); const box=$("#loginErr"); box.classList.add("hidden");
  try{ S.me = await api("POST","/api/login",{login:$("#lUser").value,senha:$("#lPass").value}); S.view="painel"; await showApp(); }
  catch(err){ box.textContent=err.message; box.classList.remove("hidden"); }
});
$("#btnSair").onclick = async ()=>{ try{ await api("POST","/api/logout"); }catch(e){} S.me=null; showLogin(); };
$("#btnSenha").onclick = ()=>{
  const m = modal(`<h2>Alterar senha</h2><div id="mErr"></div>
    <div class="row"><div><label>Senha atual</label><input id="f_atual" type="password"></div></div>
    <div class="row"><div><label>Nova senha (mín. 6 caracteres)</label><input id="f_nova" type="password"></div></div>`,
    async ()=>{ await api("POST","/api/minha-senha",{atual:$("#f_atual").value,nova:$("#f_nova").value}); toast("Senha alterada"); }, {sm:true});
};

/* ---------- Navegação ---------- */
function menu(){
  const it = [["painel","📊","Painel"],["os","🔧","Ordens de Serviço"],["clientes","👥","Clientes"],["produtos","📦","Produtos"]];
  if(S.me.admin){ it.push(["usuarios","🔑","Usuários"],["config","⚙️","Configurações"]); }
  $("#nav").innerHTML = it.map(([k,i,t])=>`<button data-k="${k}" class="${S.view===k?"on":""}"><span>${i}</span>${t}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function go(v){ S.view=v; menu(); ({painel:vPainel,os:vOS,clientes:vClientes,produtos:vProdutos,usuarios:vUsuarios,config:vConfig})[v](); window.scrollTo(0,0); }
async function refresh(){ await loadAll(); go(S.view); }

/* ---------- Modal ---------- */
function modal(html, onSave, opt={}){
  const ov = document.createElement("div"); ov.className="ov";
  ov.innerHTML = `<div class="modal ${opt.sm?"sm":""}">${html}<div class="foot"><button class="btn" data-x>Cancelar</button>${onSave?`<button class="btn pri" data-ok>${opt.okText||"Salvar"}</button>`:""}</div></div>`;
  document.body.appendChild(ov);
  const close = ()=>ov.remove();
  ov.querySelector("[data-x]").onclick = close;
  ov.addEventListener("mousedown",e=>{ if(e.target===ov) ov._down=true; else ov._down=false; });
  const ok = ov.querySelector("[data-ok]");
  if(ok) ok.onclick = async ()=>{
    const box = ov.querySelector("#mErr"); if(box) box.innerHTML="";
    ok.disabled = true;
    try{ await onSave(ov); close(); await refresh(); }
    catch(err){ if(box) box.innerHTML = `<div class="err">${esc(err.message)}</div>`; else toast(err.message); }
    finally{ ok.disabled=false; }
  };
  const first = ov.querySelector("input,select,textarea"); if(first) first.focus();
  ov.close = close; return ov;
}
async function confirmDel(msg, fn){
  if(!confirm(msg)) return;
  try{ await fn(); toast("Excluído"); await refresh(); }catch(e){ toast(e.message); }
}
const val = id => $("#"+id).value;

/* ---------- Painel ---------- */
function vPainel(){
  const abertas = S.os.filter(o=>["Aberta","Em andamento","Aguardando peça","Aguardando aprovação"].includes(o.status));
  const mes = new Date().toISOString().slice(0,7);
  const fat = S.os.filter(o=>["Concluída","Entregue"].includes(o.status) && (o.conclusao||"").startsWith(mes)).reduce((s,o)=>s+o.total,0);
  const receber = S.os.filter(o=>["Concluída","Entregue"].includes(o.status) && !o.pago).reduce((s,o)=>s+o.total,0);
  const baixo = S.produtos.filter(p=>p.tipo==="peca" && p.estMin>0 && p.estoque<=p.estMin);
  const por = {}; S.os.forEach(o=>por[o.status]=(por[o.status]||0)+1);
  $("#main").innerHTML = `
    <h1>Painel</h1><div class="sub">Olá, ${esc(S.me.nome)}! Resumo da ${esc(S.config.oficina||"oficina")}.</div>
    <div class="grid g4">
      <div class="card kpi"><div class="l">O.S em andamento</div><div class="n">${abertas.length}</div></div>
      <div class="card kpi"><div class="l">Faturado no mês</div><div class="n">${money(fat)}</div></div>
      <div class="card kpi"><div class="l">A receber</div><div class="n" style="color:var(--warn)">${money(receber)}</div></div>
      <div class="card kpi"><div class="l">Clientes</div><div class="n">${S.clientes.length}</div></div>
    </div><br>
    <div class="grid g2">
      <div class="card"><b>O.S por status</b><br><br>${STATUS.map(s=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span class="tag ${tagCls(s)}">${s}</span><b>${por[s]||0}</b></div>`).join("")}</div>
      <div class="card"><b>Estoque baixo</b><br><br>${baixo.length?baixo.map(p=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(p.nome)}</span><span class="low">${p.estoque} / mín. ${p.estMin}</span></div>`).join(""):`<div class="mut">Nenhum produto abaixo do estoque mínimo.</div>`}</div>
    </div><br>
    <div class="card"><b>Últimas O.S</b><br><br>${S.os.slice(0,6).map(o=>`<div style="display:flex;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><b>#${o.numero}</b><span style="flex:1">${esc((clienteById(o.clienteId)||{}).nome||"-")} <span class="mut">· ${esc(o.veiculo)} ${esc(o.placa)}</span></span><span class="tag ${tagCls(o.status)}">${o.status}</span><b>${money(o.total)}</b></div>`).join("")||`<div class="mut">Nenhuma O.S ainda.</div>`}</div>`;
}

/* ---------- Clientes ---------- */
function vClientes(){
  const q = norm(S.busca.cli);
  const list = S.clientes.filter(c=>!q||norm([c.nome,c.telefone,c.documento,c.email,c.cidade].join(" ")).includes(q));
  $("#main").innerHTML = `<h1>Clientes</h1><div class="sub">${S.clientes.length} cadastrado(s)</div>
    <div class="bar"><input class="search" id="q" placeholder="Buscar por nome, telefone, CPF..." value="${esc(S.busca.cli)}"><span class="grow"></span><button class="btn pri" id="novo">+ Novo cliente</button></div>
    <div class="tw"><table><thead><tr><th>Nome</th><th>Telefone</th><th>Documento</th><th>Cidade</th><th class="r">Ações</th></tr></thead><tbody>
    ${list.map(c=>`<tr><td><b>${esc(c.nome)}</b><div class="mut">${esc(c.email)}</div></td><td>${esc(c.telefone)}</td><td>${esc(c.documento)}</td><td>${esc(c.cidade)}</td>
      <td class="r" style="white-space:nowrap">
        <button class="btn wa sm" data-wa="${c.id}">WhatsApp</button>
        <button class="btn sm" data-os="${c.id}">Nova O.S</button>
        <button class="btn sm" data-ed="${c.id}">Editar</button>
        <button class="btn red sm" data-del="${c.id}">Excluir</button></td></tr>`).join("")}
    </tbody></table>${list.length?"":`<div class="empty">Nenhum cliente encontrado.</div>`}</div>`;
  const q$ = $("#q"); q$.oninput = ()=>{ S.busca.cli=q$.value; const p=q$.selectionStart; vClientes(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); };
  $("#novo").onclick = ()=>formCliente();
  $("#main").querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>formCliente(clienteById(+b.dataset.ed)));
  $("#main").querySelectorAll("[data-os]").forEach(b=>b.onclick=()=>formOS(null,+b.dataset.os));
  $("#main").querySelectorAll("[data-wa]").forEach(b=>b.onclick=()=>{ const c=clienteById(+b.dataset.wa); waOpen(c.telefone,`Olá ${c.nome.split(" ")[0]}! Aqui é da ${S.config.oficina||"oficina"}.`); });
  $("#main").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const c=clienteById(+b.dataset.del); confirmDel(`Excluir o cliente "${c.nome}"?`,()=>api("DELETE","/api/clientes/"+c.id)); });
}
function formCliente(c){
  c = c || {nome:"",telefone:"",email:"",documento:"",endereco:"",cidade:"",obs:""};
  modal(`<h2>${c.id?"Editar":"Novo"} cliente</h2><div id="mErr"></div>
    <div class="row c2"><div><label>Nome *</label><input id="f_nome" value="${esc(c.nome)}"></div><div><label>Telefone / WhatsApp</label><input id="f_tel" placeholder="(54) 99999-9999" value="${esc(c.telefone)}"></div></div>
    <div class="row c2"><div><label>CPF / CNPJ</label><input id="f_doc" value="${esc(c.documento)}"></div><div><label>E-mail</label><input id="f_email" value="${esc(c.email)}"></div></div>
    <div class="row c2"><div><label>Endereço</label><input id="f_end" value="${esc(c.endereco)}"></div><div><label>Cidade</label><input id="f_cid" value="${esc(c.cidade)}"></div></div>
    <div class="row"><div><label>Observações</label><textarea id="f_obs">${esc(c.obs)}</textarea></div></div>`,
    async ()=>{
      const body = {nome:val("f_nome"),telefone:val("f_tel"),email:val("f_email"),documento:val("f_doc"),endereco:val("f_end"),cidade:val("f_cid"),obs:val("f_obs")};
      await (c.id ? api("PUT","/api/clientes/"+c.id,body) : api("POST","/api/clientes",body));
    });
}

/* ---------- Produtos ---------- */
function vProdutos(){
  const q = norm(S.busca.prod);
  const list = S.produtos.filter(p=>!q||norm([p.nome,p.codigo,p.categoria].join(" ")).includes(q));
  $("#main").innerHTML = `<h1>Produtos e serviços</h1><div class="sub">${S.produtos.length} cadastrado(s)</div>
    <div class="bar"><input class="search" id="q" placeholder="Buscar por nome, código, categoria..." value="${esc(S.busca.prod)}"><span class="grow"></span><button class="btn pri" id="novo">+ Novo produto</button></div>
    <div class="tw"><table><thead><tr><th>Código</th><th>Nome</th><th>Tipo</th><th>Categoria</th><th class="r">Custo</th><th class="r">Preço</th><th class="r">Estoque</th><th class="r">Ações</th></tr></thead><tbody>
    ${list.map(p=>`<tr><td>${esc(p.codigo)}</td><td><b>${esc(p.nome)}</b></td><td>${p.tipo==="servico"?"Serviço":"Peça"}</td><td>${esc(p.categoria)}</td><td class="r">${money(p.custo)}</td><td class="r">${money(p.preco)}</td>
      <td class="r">${p.tipo==="servico"?"—":`<span class="${p.estMin>0&&p.estoque<=p.estMin?"low":""}">${p.estoque}</span>`}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm" data-ed="${p.id}">Editar</button> <button class="btn red sm" data-del="${p.id}">Excluir</button></td></tr>`).join("")}
    </tbody></table>${list.length?"":`<div class="empty">Nenhum produto encontrado.</div>`}</div>`;
  const q$ = $("#q"); q$.oninput = ()=>{ S.busca.prod=q$.value; const p=q$.selectionStart; vProdutos(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); };
  $("#novo").onclick = ()=>formProduto();
  $("#main").querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>formProduto(produtoById(+b.dataset.ed)));
  $("#main").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const p=produtoById(+b.dataset.del); confirmDel(`Excluir "${p.nome}"? As O.S já feitas mantêm a descrição do item.`,()=>api("DELETE","/api/produtos/"+p.id)); });
}
function formProduto(p){
  p = p || {codigo:"",nome:"",categoria:"",tipo:"peca",custo:0,preco:0,estoque:0,estMin:0};
  modal(`<h2>${p.id?"Editar":"Novo"} produto / serviço</h2><div id="mErr"></div>
    <div class="row c2"><div><label>Nome *</label><input id="f_nome" value="${esc(p.nome)}"></div><div><label>Código</label><input id="f_cod" value="${esc(p.codigo)}"></div></div>
    <div class="row c3"><div><label>Tipo</label><select id="f_tipo"><option value="peca" ${p.tipo!=="servico"?"selected":""}>Peça / produto</option><option value="servico" ${p.tipo==="servico"?"selected":""}>Serviço</option></select></div>
      <div><label>Categoria</label><input id="f_cat" value="${esc(p.categoria)}"></div><div><label>Custo (R$)</label><input id="f_custo" value="${p.custo}"></div></div>
    <div class="row c3"><div><label>Preço de venda (R$)</label><input id="f_preco" value="${p.preco}"></div><div><label>Estoque atual</label><input id="f_est" value="${p.estoque}"></div><div><label>Estoque mínimo</label><input id="f_min" value="${p.estMin}"></div></div>`,
    async ()=>{
      const body = {nome:val("f_nome"),codigo:val("f_cod"),tipo:val("f_tipo"),categoria:val("f_cat"),custo:num(val("f_custo")),preco:num(val("f_preco")),estoque:num(val("f_est")),estMin:num(val("f_min"))};
      await (p.id ? api("PUT","/api/produtos/"+p.id,body) : api("POST","/api/produtos",body));
    });
}

/* ---------- Ordens de serviço ---------- */
function vOS(){
  const q = norm(S.busca.os), st = S.busca.status;
  const list = S.os.filter(o=>{
    const c = clienteById(o.clienteId)||{};
    return (!st||o.status===st) && (!q||norm([o.numero,c.nome,o.placa,o.veiculo,o.defeito].join(" ")).includes(q));
  });
  $("#main").innerHTML = `<h1>Ordens de Serviço</h1><div class="sub">${S.os.length} O.S no total</div>
    <div class="bar"><input class="search" id="q" placeholder="Buscar por nº, cliente, placa..." value="${esc(S.busca.os)}">
      <select id="fst" style="max-width:200px"><option value="">Todos os status</option>${STATUS.map(s=>`<option ${st===s?"selected":""}>${s}</option>`).join("")}</select>
      <span class="grow"></span><button class="btn pri" id="novo">+ Nova O.S</button></div>
    <div class="tw"><table><thead><tr><th>Nº</th><th>Abertura</th><th>Cliente</th><th>Veículo</th><th>Status</th><th class="r">Total</th><th>Pago</th><th class="r">Ações</th></tr></thead><tbody>
    ${list.map(o=>{ const c=clienteById(o.clienteId)||{nome:"(removido)"}; return `<tr><td><b>#${o.numero}</b></td><td>${fdate(o.abertura)}</td><td>${esc(c.nome)}</td><td>${esc(o.veiculo)} <span class="mut">${esc(o.placa)}</span></td>
      <td><span class="tag ${tagCls(o.status)}">${o.status}</span></td><td class="r"><b>${money(o.total)}</b></td><td>${o.pago?"✔":"—"}</td>
      <td class="r" style="white-space:nowrap"><button class="btn wa sm" data-wa="${o.id}">WhatsApp</button> <button class="btn sm" data-pr="${o.id}">Imprimir</button> <button class="btn sm" data-ed="${o.id}">Abrir</button>${S.me.admin?` <button class="btn red sm" data-del="${o.id}">Excluir</button>`:""}</td></tr>`; }).join("")}
    </tbody></table>${list.length?"":`<div class="empty">Nenhuma O.S encontrada.</div>`}</div>`;
  const q$ = $("#q"); q$.oninput = ()=>{ S.busca.os=q$.value; const p=q$.selectionStart; vOS(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); };
  $("#fst").onchange = e=>{ S.busca.status=e.target.value; vOS(); };
  $("#novo").onclick = ()=>formOS();
  const byId = id=>S.os.find(o=>o.id===+id);
  $("#main").querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>formOS(byId(b.dataset.ed)));
  $("#main").querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>imprimirOS(byId(b.dataset.pr)));
  $("#main").querySelectorAll("[data-wa]").forEach(b=>b.onclick=()=>{ const o=byId(b.dataset.wa); waOpen((clienteById(o.clienteId)||{}).telefone, msgOS(o)); });
  $("#main").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const o=byId(b.dataset.del); confirmDel(`Excluir a O.S #${o.numero}?`,()=>api("DELETE","/api/os/"+o.id)); });
}

function formOS(o, clienteId){
  if(!S.clientes.length){ toast("Cadastre um cliente antes de abrir uma O.S"); return; }
  const novo = !o;
  o = o ? JSON.parse(JSON.stringify(o)) : {clienteId:clienteId||0,veiculo:"",placa:"",km:"",defeito:"",diagnostico:"",status:"Aberta",itens:[],maoDeObra:0,desconto:0,pagamento:"",pago:false,obs:""};
  const itens = o.itens;
  const m = modal(`<h2>${novo?"Nova O.S":"O.S #"+o.numero}</h2><div id="mErr"></div>
    <div class="row c2"><div><label>Cliente *</label><select id="f_cli"><option value="0">Selecione...</option>${S.clientes.map(c=>`<option value="${c.id}" ${c.id===o.clienteId?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></div>
      <div><label>Status</label><select id="f_st">${STATUS.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div></div>
    <div class="row c3"><div><label>Veículo (marca/modelo/ano)</label><input id="f_vei" value="${esc(o.veiculo)}"></div><div><label>Placa</label><input id="f_placa" value="${esc(o.placa)}" style="text-transform:uppercase"></div><div><label>KM</label><input id="f_km" value="${esc(o.km)}"></div></div>
    <div class="row c2"><div><label>Defeito relatado</label><textarea id="f_def">${esc(o.defeito)}</textarea></div><div><label>Diagnóstico / serviço executado</label><textarea id="f_diag">${esc(o.diagnostico)}</textarea></div></div>
    <label>Peças e serviços</label>
    <div class="tw"><table class="items"><thead><tr><th>Descrição</th><th style="width:80px">Qtd</th><th style="width:110px">Preço un.</th><th class="r" style="width:110px">Subtotal</th><th style="width:40px"></th></tr></thead><tbody id="itBody"></tbody></table></div>
    <div class="bar" style="margin-top:8px"><select id="addProd" style="max-width:330px"><option value="">+ Adicionar do cadastro de produtos...</option>${S.produtos.map(p=>`<option value="${p.id}">${esc(p.nome)} — ${money(p.preco)}${p.tipo==="peca"?` (est. ${p.estoque})`:""}</option>`).join("")}</select>
      <button class="btn sm" id="addLivre" type="button">+ Item avulso</button></div>
    <div class="row c4" style="margin-top:10px"><div><label>Forma de pagamento</label><input id="f_pag" value="${esc(o.pagamento)}" placeholder="Pix, cartão, dinheiro..."></div>
      <div><label>Mão de obra (R$)</label><input id="f_mo" value="${o.maoDeObra}"></div><div><label>Desconto (R$)</label><input id="f_desc" value="${o.desconto}"></div>
      <div><label>&nbsp;</label><span class="chk"><input type="checkbox" id="f_pago" ${o.pago?"checked":""}> Pago</span></div></div>
    <div class="row"><div><label>Observações</label><textarea id="f_obs">${esc(o.obs)}</textarea></div></div>
    <div class="total">Total: <span id="tot">R$ 0,00</span></div>
    <div class="mut" style="font-size:12px;text-align:right">O estoque das peças é baixado automaticamente quando a O.S fica Concluída ou Entregue.</div>`,
    async ()=>{
      const body = {clienteId:+val("f_cli"),status:val("f_st"),veiculo:val("f_vei"),placa:val("f_placa").toUpperCase(),km:val("f_km"),defeito:val("f_def"),diagnostico:val("f_diag"),
        itens:itens.filter(i=>i.descricao.trim()||i.produtoId).map(i=>({produtoId:i.produtoId||0,descricao:i.descricao,qtd:i.qtd,preco:i.preco})),
        maoDeObra:num(val("f_mo")),desconto:num(val("f_desc")),pagamento:val("f_pag"),pago:$("#f_pago").checked,obs:val("f_obs")};
      await (novo ? api("POST","/api/os",body) : api("PUT","/api/os/"+o.id,body));
    }, {okText:"Salvar O.S"});
  m.querySelector(".modal").style.maxWidth="880px";

  const body = m.querySelector("#itBody");
  const total = ()=>{ const t = itens.reduce((s,i)=>s+i.qtd*i.preco,0)+num(m.querySelector("#f_mo").value)-num(m.querySelector("#f_desc").value); m.querySelector("#tot").textContent = money(Math.max(t,0)); };
  const draw = ()=>{
    body.innerHTML = itens.length ? itens.map((it,i)=>`<tr><td><input data-f="descricao" data-i="${i}" value="${esc(it.descricao)}"></td><td><input data-f="qtd" data-i="${i}" value="${it.qtd}"></td><td><input data-f="preco" data-i="${i}" value="${it.preco}"></td><td class="r" data-sub="${i}">${money(it.qtd*it.preco)}</td><td><button class="btn red sm" data-rm="${i}" type="button">✕</button></td></tr>`).join("")
      : `<tr><td colspan="5" class="mut" style="text-align:center">Nenhum item. Adicione peças ou serviços abaixo.</td></tr>`;
    body.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{
      const i=+inp.dataset.i, f=inp.dataset.f;
      itens[i][f] = f==="descricao" ? inp.value : num(inp.value);
      const sub = body.querySelector(`[data-sub="${i}"]`); if(sub) sub.textContent = money(itens[i].qtd*itens[i].preco);
      total();
    });
    body.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ itens.splice(+b.dataset.rm,1); draw(); });
    total();
  };
  m.querySelector("#addProd").onchange = e=>{
    const p = produtoById(+e.target.value); if(!p) return;
    itens.push({produtoId:p.id,descricao:p.nome,qtd:1,preco:p.preco}); e.target.value=""; draw();
  };
  m.querySelector("#addLivre").onclick = ()=>{ itens.push({produtoId:0,descricao:"",qtd:1,preco:0}); draw(); };
  m.querySelector("#f_mo").oninput = total; m.querySelector("#f_desc").oninput = total;
  draw();

  if(!novo){
    const foot = m.querySelector(".foot");
    const wa = document.createElement("button"); wa.className="btn wa"; wa.type="button"; wa.textContent="WhatsApp";
    wa.onclick = ()=>waOpen((clienteById(o.clienteId)||{}).telefone, msgOS(o));
    const pr = document.createElement("button"); pr.className="btn"; pr.type="button"; pr.textContent="Imprimir";
    pr.onclick = ()=>imprimirOS(o);
    foot.prepend(pr); foot.prepend(wa); foot.style.justifyContent="flex-end";
  }
}

function imprimirOS(o){
  const c = clienteById(o.clienteId)||{}, cfg = S.config;
  const linhas = o.itens.map(i=>`<tr><td>${esc(i.descricao)}</td><td style="text-align:right">${i.qtd}</td><td style="text-align:right">${money(i.preco)}</td><td style="text-align:right">${money(i.qtd*i.preco)}</td></tr>`).join("");
  const w = window.open("","_blank");
  if(!w){ toast("Permita pop-ups para imprimir"); return; }
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>O.S ${o.numero}</title><style>
    body{font-family:Arial,sans-serif;font-size:13px;color:#111;margin:28px}
    h1{font-size:20px;margin:0}h2{font-size:14px;margin:18px 0 6px;border-bottom:1px solid #999;padding-bottom:3px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:10px}
    table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:5px 7px;text-align:left}th{background:#eee}
    .g{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}.t{text-align:right;font-size:16px;font-weight:bold;margin-top:10px}
    .ass{display:flex;gap:40px;margin-top:60px}.ass div{flex:1;border-top:1px solid #111;text-align:center;padding-top:4px}
    @media print{body{margin:10mm}}</style></head><body>
    <div class="top"><div><h1>${esc(cfg.oficina||"Oficina")}</h1><div>${esc(cfg.endereco||"")}<br>${esc(cfg.telefone||"")} ${cfg.doc?" · "+esc(cfg.doc):""}</div></div>
    <div style="text-align:right"><h1>O.S nº ${o.numero}</h1><div>Abertura: ${fdate(o.abertura)}<br>Status: ${esc(o.status)}</div></div></div>
    <h2>Cliente</h2><div class="g"><div><b>Nome:</b> ${esc(c.nome)}</div><div><b>Telefone:</b> ${esc(c.telefone)}</div><div><b>Documento:</b> ${esc(c.documento)}</div><div><b>Endereço:</b> ${esc(c.endereco)} ${esc(c.cidade)}</div></div>
    <h2>Veículo</h2><div class="g"><div><b>Veículo:</b> ${esc(o.veiculo)}</div><div><b>Placa:</b> ${esc(o.placa)}</div><div><b>KM:</b> ${esc(o.km)}</div></div>
    <h2>Defeito relatado</h2><div>${esc(o.defeito).replace(/\n/g,"<br>")||"-"}</div>
    <h2>Diagnóstico / serviço executado</h2><div>${esc(o.diagnostico).replace(/\n/g,"<br>")||"-"}</div>
    <h2>Peças e serviços</h2><table><thead><tr><th>Descrição</th><th style="width:60px">Qtd</th><th style="width:100px">Preço</th><th style="width:110px">Subtotal</th></tr></thead><tbody>${linhas||`<tr><td colspan="4">—</td></tr>`}</tbody></table>
    <div class="t">Mão de obra: ${money(o.maoDeObra)} &nbsp; Desconto: ${money(o.desconto)}<br>TOTAL: ${money(o.total)}</div>
    <div>Pagamento: ${esc(o.pagamento||"-")} ${o.pago?"(pago)":""}</div>
    ${o.obs?`<h2>Observações</h2><div>${esc(o.obs).replace(/\n/g,"<br>")}</div>`:""}
    <div class="ass"><div>Cliente</div><div>${esc(cfg.oficina||"Oficina")}</div></div>
    <script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);
  w.document.close();
}

/* ---------- Usuários (admin) ---------- */
async function vUsuarios(){
  const us = await api("GET","/api/usuarios");
  $("#main").innerHTML = `<h1>Usuários</h1><div class="sub">Quem pode acessar o sistema</div>
    <div class="bar"><span class="grow"></span><button class="btn pri" id="novo">+ Novo usuário</button></div>
    <div class="tw"><table><thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Situação</th><th class="r">Ações</th></tr></thead><tbody>
    ${us.map(u=>`<tr><td><b>${esc(u.nome)}</b></td><td>${esc(u.login)}</td><td>${u.admin?"Administrador":"Usuário"}</td><td>${u.ativo?"Ativo":`<span class="low">Inativo</span>`}</td><td class="r"><button class="btn sm" data-ed="${u.id}">Editar</button></td></tr>`).join("")}</tbody></table></div>`;
  $("#novo").onclick = ()=>formUsuario(null);
  $("#main").querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>formUsuario(us.find(u=>u.id===+b.dataset.ed)));
}
function formUsuario(u){
  modal(`<h2>${u?"Editar":"Novo"} usuário</h2><div id="mErr"></div>
    <div class="row c2"><div><label>Nome *</label><input id="f_nome" value="${esc(u?u.nome:"")}"></div><div><label>Login *</label><input id="f_login" value="${esc(u?u.login:"")}" ${u?"disabled":""}></div></div>
    <div class="row"><div><label>${u?"Nova senha (deixe em branco para manter)":"Senha * (mín. 6 caracteres)"}</label><input id="f_senha" type="password" autocomplete="new-password"></div></div>
    <div class="row c2"><span class="chk"><input type="checkbox" id="f_admin" ${u&&u.admin?"checked":""}> Administrador</span>${u?`<span class="chk"><input type="checkbox" id="f_ativo" ${u.ativo?"checked":""}> Ativo</span>`:""}</div>`,
    async ()=>{
      if(u) await api("PUT","/api/usuarios/"+u.id,{nome:val("f_nome"),senha:val("f_senha"),admin:$("#f_admin").checked,ativo:$("#f_ativo").checked});
      else await api("POST","/api/usuarios",{nome:val("f_nome"),login:val("f_login"),senha:val("f_senha"),admin:$("#f_admin").checked});
    }, {sm:true});
}

/* ---------- Configurações (admin) ---------- */
function vConfig(){
  const c = S.config;
  $("#main").innerHTML = `<h1>Configurações</h1><div class="sub">Dados que aparecem na impressão da O.S e na mensagem de WhatsApp</div>
    <div class="card" style="max-width:720px"><div id="cErr"></div>
      <div class="row c2"><div><label>Nome da oficina</label><input id="c_of" value="${esc(c.oficina)}"></div><div><label>Telefone</label><input id="c_tel" value="${esc(c.telefone)}"></div></div>
      <div class="row c2"><div><label>Endereço</label><input id="c_end" value="${esc(c.endereco)}"></div><div><label>CNPJ / CPF</label><input id="c_doc" value="${esc(c.doc)}"></div></div>
      <div class="row"><div><label>Mensagem padrão do WhatsApp na O.S</label><textarea id="c_msg">${esc(c.msgOS)}</textarea>
        <div class="mut" style="font-size:12px;margin-top:4px">Use: {cliente} {oficina} {numero} {veiculo} {status} {total}</div></div></div>
      <button class="btn pri" id="c_save">Salvar configurações</button>
      <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
      <b>Backup dos dados</b><p class="mut">Baixe uma cópia de todos os dados (clientes, produtos, O.S e usuários). Os dados ficam no arquivo <code>rrv.o.s-dados.json</code>, na mesma pasta do programa.</p>
      <a class="btn" href="/api/backup">Baixar backup</a></div>`;
  $("#c_save").onclick = async ()=>{
    try{ S.config = await api("PUT","/api/config",{oficina:val("c_of"),telefone:val("c_tel"),endereco:val("c_end"),doc:val("c_doc"),msgOS:val("c_msg")}); toast("Configurações salvas"); }
    catch(e){ $("#cErr").innerHTML=`<div class="err">${esc(e.message)}</div>`; }
  };
}

/* ---------- Início ---------- */
(async ()=>{
  try{ S.me = await api("GET","/api/me"); await showApp(); }catch(e){ showLogin(); }
})();
</script>
</body>
</html>
